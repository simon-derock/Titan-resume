name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  deterministic-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --extra dev --locked
      - run: uv run pytest -m "not live_llm and not live_vision" --cov=app --cov=scripts --cov-report=term-missing -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app scripts
      - run: uv run python -m scripts.check_memory memory.md

