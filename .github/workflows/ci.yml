name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  deterministic-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --extra dev --locked
      - name: Install verified Tectonic compiler
        run: |
          mkdir -p .tools
          curl -fL --retry 3 \
            --output /tmp/tectonic-0.16.9-x86_64-unknown-linux-gnu.tar.gz \
            https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.16.9/tectonic-0.16.9-x86_64-unknown-linux-gnu.tar.gz
          echo "f3c825128095dc3399ea11c08c18035b33050a216930c295c79e8eb11bd21de4  /tmp/tectonic-0.16.9-x86_64-unknown-linux-gnu.tar.gz" \
            | sha256sum --check --strict
          tar -xzf /tmp/tectonic-0.16.9-x86_64-unknown-linux-gnu.tar.gz \
            -C .tools
      - name: Warm verified Tectonic support files
        env:
          XDG_CACHE_HOME: ${{ github.workspace }}/.tools/tectonic-cache
        run: >-
          .tools/tectonic --untrusted --keep-logs --outdir /tmp
          tests/fixtures/compiler_warmup.tex
      - run: uv run pytest -m "not live_llm and not live_vision" --cov=app --cov=scripts --cov-report=term-missing -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app scripts
      - run: uv run python -m scripts.check_memory memory.md

